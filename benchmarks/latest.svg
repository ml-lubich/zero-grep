<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">Warm search latency on Linux kernel source</title>
<desc id="desc">Logarithmic benchmark chart on 97,398 files and 1.68 gigabytes, Apple M3 Max. Lower is faster. Nine alternating runs per query.</desc>
<rect width="100%" height="100%" rx="18" fill="#111820"/>
<text x="32" y="42" fill="#f5f7fa" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Search latency · warm index · lower is faster</text>
<text x="32" y="70" fill="#9ba7b4" font-family="system-ui,sans-serif" font-size="13">Linux kernel ebb7a8dc1 · 97,398 files · 1.68 GB · Apple M3 Max · 9 alternating runs</text>
<line x1="240.0" y1="108" x2="240.0" y2="502" stroke="#28333e"/>
<text x="240.0" y="101" text-anchor="middle" fill="#93a0ae" font-family="system-ui,sans-serif" font-size="11">1 ms</text>
<line x1="411.0" y1="108" x2="411.0" y2="502" stroke="#28333e"/>
<text x="411.0" y="101" text-anchor="middle" fill="#93a0ae" font-family="system-ui,sans-serif" font-size="11">10 ms</text>
<line x1="582.0" y1="108" x2="582.0" y2="502" stroke="#28333e"/>
