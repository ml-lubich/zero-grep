<line x1="753.0" y1="108" x2="753.0" y2="502" stroke="#28333e"/>
<text x="753.0" y="101" text-anchor="middle" fill="#93a0ae" font-family="system-ui,sans-serif" font-size="11">1,000 ms</text>
