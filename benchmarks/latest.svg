<text x="32" y="145" fill="#e8edf2" font-family="ui-monospace,monospace" font-size="14">ACPI_COMPANION</text>
<text x="32" y="164" fill="#62d6b5" font-family="system-ui,sans-serif" font-size="11">zero-grep</text>
