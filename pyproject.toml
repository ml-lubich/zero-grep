[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "zero-grep"
version = "0.1.0"
description = "Fast, indexed code search for large repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "zero-grep contributors" }]
keywords = ["grep", "search", "regex", "code-search", "rust"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Search",
]

[project.urls]
Repository = "https://github.com/ml-lubich/zero-grep"

[project.scripts]
zg = "zero_grep.cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "zero_grep._core"
python-source = "python"
features = ["python"]
